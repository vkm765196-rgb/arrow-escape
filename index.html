<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Clear the Board - 2000 Levels</title>
  
  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- CSS Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- App Viewport -->
  <div class="app-viewport">
    
    <!-- 1. Header Section (Exact Mobile Screenshot Match) -->
    <header class="header-container">
      <h1 class="main-title">Clear<br>the Board</h1>

      <!-- Subheader: ‹ | Level X | › | ⚙️ -->
      <div class="sub-header-row">
        <div class="level-nav-group">
          <button id="nav-prev-btn" class="nav-icon-btn" title="Previous Level">‹</button>
          <button id="level-title-btn" class="level-title-btn" title="Choose Level">
            <span id="level-title-text">Level 1</span>
            <span class="speed-badge">Slow 🐢</span>
          </button>
          <button id="nav-next-btn" class="nav-icon-btn" title="Next Level">›</button>
        </div>
        <button id="nav-settings-btn" class="nav-icon-btn" title="Settings">⚙️</button>
      </div>

      <!-- Status Bar: ↗ Count | ❤️ ❤️ ❤️ | Difficulty -->
      <div class="status-bar-row">
        <div class="status-pill">
          <span class="arrow-counter-icon">↗</span>
          <span id="remaining-count">6</span>
        </div>

        <div id="hearts-container" class="hearts-container">
          <span class="heart-icon">❤️</span>
          <span class="heart-icon">❤️</span>
          <span class="heart-icon">❤️</span>
        </div>

        <div id="difficulty-badge" class="status-pill cursor-pointer" title="Change Difficulty (Easy / Normal / Hard)" style="cursor: pointer;">
          <span id="difficulty-text">Normal</span>
          <span style="font-size: 0.75rem; margin-left: 4px; opacity: 0.7;">▾</span>
        </div>
      </div>
    </header>

    <!-- 2. Main Playfield (Responsive SVG Board) -->
    <main class="board-container">
      <canvas id="particles-canvas"></canvas>
      <svg id="game-svg"></svg>

      <!-- Zoom In / Zoom Out Floating Controls -->
      <div id="zoom-controls" class="zoom-controls-widget" title="Zoom & Pan Controls">
        <button id="btn-zoom-in" class="zoom-control-btn" title="Zoom In (＋)">＋</button>
        <button id="btn-zoom-reset" class="zoom-control-btn zoom-level-display" title="Reset Zoom (Fit)">100%</button>
        <button id="btn-zoom-out" class="zoom-control-btn" title="Zoom Out (－)">－</button>
      </div>
    </main>

    <!-- 3. Bottom Controls: Floating Circular Buttons (💡 3 | #) -->
    <footer class="bottom-actions-container">
      <!-- Lightbulb Hint Button -->
      <button id="btn-hint" class="floating-action-btn" title="Use Hint">
        <span>💡</span>
        <span id="hint-badge" class="btn-badge-counter">3</span>
      </button>

      <!-- Grid / Levels Button (#) -->
      <button id="btn-levels" class="floating-action-btn" title="Select Level (1 - 2000)">
        <span style="font-family: monospace; font-weight: 800; font-size: 1.4rem;">#</span>
      </button>
    </footer>

  </div>

  <!-- ==========================================================================
       4. VICTORY SCREEN (Exact Replica matching Train Your Brain screenshot)
       ========================================================================== -->
  <div id="victory-modal" class="victory-overlay">
    <div class="victory-header-group">
      <h2 class="victory-train-title">Train<br>Your Brain</h2>
      <h3 class="victory-sub-title">Level Completed!</h3>
    </div>

    <!-- Center Card with Maze Blueprint Preview -->
    <div class="victory-puzzle-card">
      <svg id="victory-blueprint-svg"></svg>
    </div>

    <!-- Bottom Buttons -->
    <div class="victory-footer-group">
      <button id="victory-newgame-btn" class="victory-newgame-btn">New Game</button>
      <button id="victory-main-btn" class="victory-main-btn">Main</button>
    </div>
  </div>

  <!-- ==========================================================================
       5. 1000-LEVEL SELECTOR MODAL
       ========================================================================== -->
  <div id="level-select-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header-row">
        <h2 class="modal-title">Select Level (1 - 2000)</h2>
        <button id="modal-close-btn" class="modal-close-btn">&times;</button>
      </div>

      <!-- Quick Jump Input -->
      <div class="jump-input-row">
        <input type="number" id="jump-level-input" class="jump-input" placeholder="Jump to level (1 - 2000)" min="1" max="2000">
        <button id="jump-go-btn" class="jump-go-btn">Go</button>
      </div>

      <!-- Range Filter Tabs -->
      <div class="range-tabs">
        <button class="range-tab-btn active" data-start="1" data-end="100">1 - 100</button>
        <button class="range-tab-btn" data-start="101" data-end="250">101 - 250</button>
        <button class="range-tab-btn" data-start="251" data-end="500">251 - 500</button>
        <button class="range-tab-btn" data-start="501" data-end="1000">501 - 1000</button>
        <button class="range-tab-btn" data-start="1001" data-end="1500">1001 - 1500</button>
        <button class="range-tab-btn" data-start="1501" data-end="2000">1501 - 2000</button>
      </div>

      <!-- Scrollable Levels Grid -->
      <div id="levels-scroll-grid" class="levels-scroll-grid"></div>
    </div>
  </div>

  <!-- ==========================================================================
       6. GAME OVER MODAL
       ========================================================================== -->
  <div id="gameover-modal" class="modal-overlay">
    <div class="modal-card gameover-card">
      <div class="gameover-icon">💔</div>
      <h2 class="modal-title" style="color: #ef4444;">Out of Lives!</h2>
      <p style="color: #64748b; margin-bottom: 24px; font-size: 0.95rem;">Look closely at which arrows block others before tapping.</p>
      
      <button id="gameover-retry-btn" class="jump-go-btn" style="width: 100%; padding: 14px 0; font-size: 1.05rem;">Try Again ↺</button>
    </div>
  </div>

  <!-- ==========================================================================
       7. DIFFICULTY SELECTOR MODAL (Easy, Normal, Hard)
       ========================================================================== -->
  <div id="difficulty-modal" class="modal-overlay">
    <div class="modal-card" style="max-width: 380px; text-align: center;">
      <div class="modal-header-row" style="margin-bottom: 12px;">
        <h2 class="modal-title">Game Difficulty</h2>
        <button id="difficulty-modal-close-btn" class="modal-close-btn">&times;</button>
      </div>
      <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">Apni pasand ke mutabiq difficulty select karein:</p>
      
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <button class="difficulty-select-btn" data-diff="Easy" style="border: 2px solid #22c55e; background: #f0fdf4; color: #15803d; border-radius: 14px; padding: 14px 18px; font-weight: 800; font-size: 1.05rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: transform 0.15s ease;">
          <span>🟢 Easy (Aasan)</span>
          <span style="font-size: 0.85rem; font-weight: 600; opacity: 0.85;">5 - 10 Arrows</span>
        </button>

        <button class="difficulty-select-btn" data-diff="Normal" style="border: 2px solid #0284c7; background: #f0f9ff; color: #0369a1; border-radius: 14px; padding: 14px 18px; font-weight: 800; font-size: 1.05rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: transform 0.15s ease;">
          <span>🟡 Normal (Madhyam)</span>
          <span style="font-size: 0.85rem; font-weight: 600; opacity: 0.85;">12 - 22 Arrows</span>
        </button>

        <button class="difficulty-select-btn" data-diff="Hard" style="border: 2px solid #ea580c; background: #fff7ed; color: #c2410c; border-radius: 14px; padding: 14px 18px; font-weight: 800; font-size: 1.05rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: transform 0.15s ease;">
          <span>🔴 Hard (Kathin)</span>
          <span style="font-size: 0.85rem; font-weight: 600; opacity: 0.85;">25 - 42 Arrows</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="audio.js"></script>
  <script src="particles.js"></script>
  <script src="levels.js"></script>
  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
